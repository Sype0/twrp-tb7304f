# Builds OrangeFox (fox_9.0) for the Lenovo TB-7304F
name: Build OrangeFox

on:
  push:
    branches: [fox-9.0]
    paths-ignore: ['**.md']
  workflow_dispatch:

env:
  DEVICE: TB7304F
  DEVICE_PATH: device/lenovo/TB7304F
  TWRP_DIR: ${{ github.workspace }}/twrp

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell
          df -h /

      - name: Check out the device tree
        uses: actions/checkout@v4
        with:
          path: tree

      - name: Install the build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio curl flex g++-multilib gcc-multilib git gnupg gperf \
            lib32z1-dev libncurses5 libncurses5-dev libssl-dev libtinfo5 libxml2 libxml2-utils lzop \
            patch python2 python3 rsync unzip xsltproc xz-utils zip zlib1g-dev
          sudo ln -sf /usr/bin/python2 /usr/local/bin/python
          sudo curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+rx /usr/local/bin/repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global color.ui false

      - name: Sync the OrangeFox sources
        run: |
          # fox_9.0 is no longer maintained upstream; its sync script lives in
          # the legacy directory of OrangeFox/sync
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git "$GITHUB_WORKSPACE/sync"
          cd "$GITHUB_WORKSPACE/sync/legacy"
          bash orangefox_sync_legacy.sh --branch 9.0 --path "$TWRP_DIR"
          test -f "$TWRP_DIR/build/envsetup.sh"
          test -f "$TWRP_DIR/bootable/recovery/gui/theme/portrait_hdpi/ui.xml"
          test -f "$TWRP_DIR/vendor/recovery/OrangeFox.sh"
          df -h /

      - name: Place the device tree
        run: |
          mkdir -p "$TWRP_DIR/$(dirname "$DEVICE_PATH")"
          cp -a "$GITHUB_WORKSPACE/tree" "$TWRP_DIR/$DEVICE_PATH"
          rm -rf "$TWRP_DIR/$DEVICE_PATH/.git" "$TWRP_DIR/$DEVICE_PATH/.github"

      - name: Build
        run: |
          set +e
          cd "$TWRP_DIR"
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
          export LC_ALL="C"
          export TARGET_ARCH=arm
          export FOX_BUILD_TYPE=Unofficial
          export OF_MAINTAINER=Sype0
          # The recovery partition is 16 MiB and the kernel takes 7.5 MiB of it
          export FOX_DRASTIC_SIZE_REDUCTION=1
          export FOX_REMOVE_AAPT=1
          export FOX_REMOVE_BASH=1
          export FOX_REMOVE_ZIP_BINARY=1
          export FOX_EXCLUDE_NANO_EDITOR=1
          export FOX_USE_LZMA_COMPRESSION=1
          export OF_DISABLE_MIUI_SPECIFIC_FEATURES=1
          export OF_NO_TREBLE_COMPATIBILITY_CHECK=1
          export OF_DONT_PATCH_ENCRYPTED_DEVICE=1
          source build/envsetup.sh
          lunch "omni_${DEVICE}-eng" || exit 1
          mka recoveryimage 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          [ "${PIPESTATUS[0]}" = "0" ] || exit 1
          ls -l "out/target/product/$DEVICE/"

      - name: Collect the output
        id: out
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd "$GITHUB_WORKSPACE/dist"
          out="$TWRP_DIR/out/target/product/$DEVICE"
          img=$(ls "$out"/OrangeFox-*.img 2>/dev/null | head -n1)
          [ -n "$img" ] || img="$out/recovery.img"
          name=$(basename "${img%.img}")
          cp -v "$img" recovery.img
          # The bootloader only accepts kernels and ramdisks with MediaTek headers
          python3 "$GITHUB_WORKSPACE/tree/tools/mtk_header.py" recovery.img "$name-mtk.img" RECOVERY
          rm recovery.img
          max=$(grep -oP 'BOARD_RECOVERYIMAGE_PARTITION_SIZE := \K[0-9]+' "$GITHUB_WORKSPACE/tree/BoardConfig.mk")
          size=$(stat -c %s "$name-mtk.img")
          echo "$name-mtk.img: $size / $max bytes"
          sha256sum *.img | tee sha256sums.txt
          echo "name=$name" >> "$GITHUB_OUTPUT"
          [ "$size" -le "$max" ] || { echo "The image does not fit the recovery partition"; exit 1; }

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload the artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-TB7304F
          path: dist/*
          if-no-files-found: ignore
